# Omarchy-flavoured Termux behaviour. Apply with: termux-reload-settings
# (keys checked against termux-app's TermuxPropertyConstants.java)

# Omarchy's terminals use a steady block cursor (ghostty: cursor-style = block, no blink)
terminal-cursor-style = block
terminal-cursor-blink-rate = 0

# Omarchy pads its terminals (14px); these are dp
terminal-margin-horizontal = 8
terminal-margin-vertical = 4

# Second key = "PFX": sends Ctrl+Space, Omarchy's tmux prefix, in one tap.
extra-keys = [['ESC',{macro: 'CTRL SPACE', display: 'PFX'},{key: '-', popup: '|'},'HOME','UP','END','PGUP'], ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]
